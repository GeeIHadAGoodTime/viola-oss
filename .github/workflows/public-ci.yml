name: Public source checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify checked-in source and dependency binding
        working-directory: SOURCE
        run: python -B tools/release/verify_source_binding.py --source . --metadata ../PUBLIC_METADATA
      - name: Install desktop test dependencies
        working-directory: SOURCE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_desktop.txt
      - name: Run public Python contracts
        working-directory: SOURCE
        run: python -m unittest discover -s tests/public -v

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "1"
      SENTRY_AUTH_TOKEN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""
      VITE_SENTRY_DSN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: SOURCE/ui/react-app/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: SOURCE/ui/react-app
        run: npm ci
      - name: Build frontend
        working-directory: SOURCE/ui/react-app
        run: npm run build
      - name: Run frontend tests
        working-directory: SOURCE/ui/react-app
        run: npm run test:run
      - name: Audit exact frontend lockfile
        working-directory: SOURCE/ui/react-app
        run: npm audit
