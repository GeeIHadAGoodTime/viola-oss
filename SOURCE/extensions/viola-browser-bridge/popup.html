<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #111827;
      color: #e5e7eb;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      margin: 0;
      color: #ffffff;
    }
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #0d3320;
      color: #4ade80;
    }
    .status.disconnected {
      background: #3b1219;
      color: #f87171;
    }
    label {
      display: block;
      color: #cbd5e1;
      font-size: 12px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #0f172a;
      color: #f9fafb;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      min-height: 36px;
      padding: 8px 10px;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }
    #connect-btn { flex: 1; background: #2563eb; }
    #connect-btn:hover { background: #1d4ed8; }
    #disconnect-btn { background: #4b5563; }
    #disconnect-btn:hover { background: #374151; }
    .result {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.4;
    }
    .notice {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Viola Browser Bridge</h1>
  </div>
  <div id="status" class="status disconnected">
    Checking Viola connection...
  </div>
  <label for="base-url-input">Viola base URL</label>
  <input id="base-url-input" type="url" spellcheck="false" placeholder="http://127.0.0.1:8080">
  <div class="actions">
    <button id="connect-btn">Connect</button>
    <button id="disconnect-btn">Disconnect</button>
  </div>
  <div id="result" class="result"></div>
  <div class="notice" id="trust-prompt">
    Confirm the exact URL before connecting. This bridge transfers no browser cookies.
  </div>
  <script src="popup.js"></script>
</body>
</html>
