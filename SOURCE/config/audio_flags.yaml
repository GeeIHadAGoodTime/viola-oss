version: 1
# Active core selection. Valid values: legacy, new
active_core: legacy

rollout:
  canary:
    enabled: false
    sample: 0.05  # 5% of cohort traffic when enabled
    cohort_key: session_id  # descriptive only; adapters supply actual key

comparison:
  enabled: true
  sample: 0.1  # Shadow test 10% of requests when legacy is active
  alerts:
    underrun_rate_threshold: 0.02
    latency_budget_ms: 150
