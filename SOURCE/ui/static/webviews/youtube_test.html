<!DOCTYPE html>
<html>
<head>
    <title>Minimal YouTube Test</title>
    <style>
        body { margin: 0; background: #000; }
        #player { width: 100%; height: 100vh; }
        #status { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <div id="player"></div>

    <script>
        var status = document.getElementById('status');
        function log(msg) {
            console.log(msg);
            status.innerHTML += '<br>' + msg;
        }

        log('Page loaded, origin: ' + window.location.origin);

        function onYouTubeIframeAPIReady() {
            log('YouTube API ready');
            var player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    enablejsapi: 1
                },
                events: {
                    onReady: function(e) { log('Player ready'); },
                    onStateChange: function(e) { log('State: ' + e.data); },
                    onError: function(e) { log('ERROR: ' + e.data); }
                }
            });
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
