<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- CRITICAL: Referrer policy required for YouTube embedding after July 2025 API update -->
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<title>Viola YouTube IFrame Player</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
			color: #fff;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
		}

		#player {
			width: 100%;
			height: 100%;
			min-width: 320px;
			min-height: 180px;
		}

		#error-message {
			display: none;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			color: #ef4444;
			font-size: 14px;
			padding: 20px;
		}

		#loading-message {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			color: #fff;
			font-size: 14px;
		}

		#debug-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			background: rgba(0,0,0,0.88);
			color: #0f0;
			font-family: monospace;
			font-size: 11px;
			line-height: 1.5;
			padding: 8px 12px;
			z-index: 99999;
			max-height: 50vh;
			overflow: auto;
			pointer-events: none;
		}
		#debug-overlay .dbg-title { color: #ff0; font-weight: bold; margin-bottom: 4px; }
		#debug-overlay .dbg-err { color: #f44; }
		#debug-overlay .dbg-ok { color: #0f0; }
		#debug-overlay .dbg-warn { color: #fa0; }
	</style>
	<!-- QWebChannel for Qt ↔ JS communication -->
	<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
	<script>
		// QWebChannel bridge (set up when available)
		var qt_bridge = null;

		// Initialize QWebChannel if available
		if (typeof QWebChannel !== 'undefined' && window.qt && window.qt.webChannelTransport) {
			new QWebChannel(window.qt.webChannelTransport, function (channel) {
				qt_bridge = channel.objects.qt_bridge;
				console.log('[Viola YouTube Player] QWebChannel connected, bridge available');
			});
		}

		// Lightweight query parser
		function getQueryParam(name) {
			const params = new URLSearchParams(window.location.search);
			const v = params.get(name);
			return v && v.trim().length > 0 ? v.trim() : null;
		}

		// =========================================================================
		// EVENT LOG - Tracks all significant events for debugging
		// =========================================================================
		window.violaEventLog = [];
		window.violaEventLogStart = Date.now();

		function logEvent(event, data) {
			var entry = {
				time: Date.now(),
				elapsed: Date.now() - window.violaEventLogStart,
				event: event,
				data: data ? JSON.parse(JSON.stringify(data)) : {}
			};
			window.violaEventLog.push(entry);
			// Keep last 50 events
			if (window.violaEventLog.length > 50) {
				window.violaEventLog.shift();
			}
			console.log('[VIOLA-EVENT]', entry.elapsed + 'ms:', event, entry.data);
		}

		// Spoke mode: mute=1 means audio comes from PCM, video is visual-only
		var muteParam = getQueryParam('mute') === '1';

		// Log initial load with FULL context for debugging origin issues
		logEvent('page_load', {
			videoId: getQueryParam('video'),
			autoplay: getQueryParam('autoplay'),
			mute: muteParam,
			// CRITICAL: Log all context to debug Error 150
			origin: window.location.origin,
			href: window.location.href,
			protocol: window.location.protocol,
			host: window.location.host,
			referrer: document.referrer,
			userAgent: navigator.userAgent.substring(0, 100)
		});
		console.error('[VIOLA-CONTEXT] =========== ENVIRONMENT ===========');
		console.error('[VIOLA-CONTEXT] window.location.origin:', window.location.origin);
		console.error('[VIOLA-CONTEXT] window.location.href:', window.location.href);
		console.error('[VIOLA-CONTEXT] document.referrer:', document.referrer);

		// =========================================================================
		// VIDEO ELEMENT STATE - Gets the real state of YouTube's internal video element
		// =========================================================================
		function getVideoElementState() {
			// YouTube embeds a video element inside the iframe - find it
			var video = document.querySelector('video');
			if (!video) {
				return { exists: false };
			}

			var bufferedEnd = 0;
			try {
				if (video.buffered && video.buffered.length > 0) {
					bufferedEnd = video.buffered.end(video.buffered.length - 1);
				}
			} catch (e) { /* ignore */ }

			return {
				exists: true,
				readyState: video.readyState,
				networkState: video.networkState,
				paused: video.paused,
				muted: video.muted,
				volume: video.volume,
				currentTime: video.currentTime,
				duration: video.duration || 0,
				error: video.error ? video.error.code : null,
				bufferedEnd: bufferedEnd,
				videoWidth: video.videoWidth,
				videoHeight: video.videoHeight,
				srcPresent: !!(video.src || video.currentSrc)
			};
		}

		// =========================================================================
		// DIAGNOSTIC FUNCTION - Collects comprehensive state for debugging
		// =========================================================================
		function collectDiagnostics() {
			var diag = {
				yt_api_loaded: !!(window.YT && window.YT.Player),
				player_exists: !!(window.violaYoutube && window.violaYoutube._player),
				player_state: -1,
				player_state_name: 'UNKNOWN',
				player_error: null,
				player_error_message: null,
				iframe_in_dom: false,
				iframe_visible: false,
				iframe_src: null,
				current_time: 0,
				duration: 0,
				video_id: getQueryParam('video'),
				video_url: window.location.href,
				collected_at: Date.now() / 1000,
				// DEBUG fields
				onReady_called: window.violaYoutube ? window.violaYoutube._onReadyCalled : false,
				initial_state_at_ready: window.violaYoutube ? window.violaYoutube._initialStateAtReady : null,
				initial_duration_at_ready: window.violaYoutube ? window.violaYoutube._initialDurationAtReady : null,
				state_history: window.violaYoutube ? window.violaYoutube._stateHistory : [],
				wants_to_play: window.violaYoutube ? window.violaYoutube._wantsToPlay : false,
				retry_count: window.violaYoutube ? window.violaYoutube._playRetryCount : 0,
				tried_muted_start: window.violaYoutube ? window.violaYoutube._triedMutedStart : false,
				// DEBUG: autoplay check conditions
				autoplay_param: window.violaYoutube ? window.violaYoutube._autoplayParam : null,
				has_playVideo_func: window.violaYoutube ? window.violaYoutube._hasPlayVideoFunc : null,
				autoplay_check_log: window.violaYoutube ? window.violaYoutube._autoplayCheckLog : null,
				last_error: window.violaYoutube ? window.violaYoutube._lastError : null,
				last_error_time: window.violaYoutube ? window.violaYoutube._lastErrorTime : null,
				// Enhanced diagnostics - event log and video element
				debug_line527_reached: window.violaYoutube ? window.violaYoutube._debugLine527Reached : null,
				video_element: getVideoElementState(),
				event_log: window.violaEventLog || [],
			};

			// Check player state
			if (diag.player_exists && window.violaYoutube._player) {
				var player = window.violaYoutube._player;

				// Get player state
				if (typeof player.getPlayerState === 'function') {
					try {
						diag.player_state = player.getPlayerState();
						var stateMap = {
							'-1': 'UNSTARTED',
							'0': 'ENDED',
							'1': 'PLAYING',
							'2': 'PAUSED',
							'3': 'BUFFERING',
							'5': 'CUED'
						};
						diag.player_state_name = stateMap[String(diag.player_state)] || 'UNKNOWN';
					} catch (e) {
						diag.player_error_message = 'Failed to get player state: ' + e.message;
					}
				}

				// Get current time and duration
				if (typeof player.getCurrentTime === 'function') {
					try {
						diag.current_time = player.getCurrentTime() || 0;
					} catch (e) { /* no-op */ }
				}

				if (typeof player.getDuration === 'function') {
					try {
						diag.duration = player.getDuration() || 0;
					} catch (e) { /* no-op */ }
				}

				// Get video URL from player
				if (typeof player.getVideoUrl === 'function') {
					try {
						diag.video_url = player.getVideoUrl();
					} catch (e) { /* no-op */ }
				}
			}

			// Check iframe in DOM
			var playerEl = document.getElementById('player');
			if (playerEl) {
				diag.iframe_in_dom = true;
				// Check if it's actually an iframe (after YT API transforms it)
				var iframe = playerEl.tagName === 'IFRAME' ? playerEl : playerEl.querySelector('iframe');
				if (iframe) {
					diag.iframe_src = iframe.src || null;
					// Check visibility
					var rect = iframe.getBoundingClientRect();
					diag.iframe_visible = rect.width > 0 && rect.height > 0;
				} else {
					// Player container exists but no iframe yet (still loading)
					diag.iframe_visible = false;
				}
			}

			return diag;
		}

		// Expose diagnostic function globally
		window.violaDiagnostics = {
			collect: collectDiagnostics,
			sendToParent: function() {
				var diag = collectDiagnostics();
				try {
					window.parent.postMessage({ type: 'yt_diagnostics', payload: diag }, '*');
				} catch (e) {
					console.warn('[Viola YouTube Player] Failed to send diagnostics to parent:', e);
				}
				return diag;
			}
		};

		// Bridge for backend/native side
		window.violaYoutube = {
			_ready: false,
			_player: null,
			_wantsToPlay: false,  // Track if we want to be playing (for retry logic)
			_playRetryCount: 0,   // Track retry attempts
			_maxPlayRetries: 10,  // Max retries before giving up
			_triedMutedStart: false,  // Track if we tried muted start workaround
			_onReadyCalled: false,  // DEBUG: Was onReady called?
			_initialStateAtReady: null,  // DEBUG: Player state when onReady fired
			_initialDurationAtReady: null,  // DEBUG: Duration when onReady fired
			_stateHistory: [],  // DEBUG: Track all state changes
			_playerCreateCount: 0,  // DEBUG: How many times YT.Player was created
			_loadVideoByIdCount: 0,  // DEBUG: How many times loadVideoById was called
			_playCallCount: 0,  // DEBUG: How many times play() was called
			_sessionStartTime: Date.now(),  // DEBUG: Session start timestamp
			loadVideo: function (videoId) {
				window.violaYoutube._loadVideoByIdCount++;
				var elapsed = Date.now() - window.violaYoutube._sessionStartTime;
				console.log('[VIOLA-YT] loadVideoById called #' + window.violaYoutube._loadVideoByIdCount +
					' videoId=' + videoId + ' elapsed=' + elapsed + 'ms timestamp=' + Date.now());
				var currentState = window.violaYoutube._player ? window.violaYoutube._player.getPlayerState() : 'no_player';
				console.log('[VIOLA-YT] Current player state before loadVideoById:', currentState);
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.loadVideoById === 'function') {
						window.violaYoutube._player.loadVideoById(videoId);
					}
				} catch (e) {
					console.error('[VIOLA-YT] loadVideoById error:', e);
				}
			},
			play: function () {
				window.violaYoutube._playCallCount++;
				var elapsed = Date.now() - window.violaYoutube._sessionStartTime;
				var currentState = window.violaYoutube._player ? window.violaYoutube._player.getPlayerState() : 'no_player';
				var duration = window.violaYoutube._player && window.violaYoutube._player.getDuration ? window.violaYoutube._player.getDuration() : 0;
				console.log('[VIOLA-YT] play() called #' + window.violaYoutube._playCallCount +
					' elapsed=' + elapsed + 'ms timestamp=' + Date.now());
				console.log('[VIOLA-YT] Current state before play:', currentState, 'duration:', duration);
				window.violaYoutube._wantsToPlay = true;
				window.violaYoutube._playRetryCount = 0;
				window.violaYoutube._triedMutedStart = false;
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.playVideo === 'function') {
						console.log('[VIOLA-YT] Calling playVideo() at', Date.now());
						window.violaYoutube._player.playVideo();
					} else {
						console.warn('[VIOLA-YT] Player not ready for playVideo()');
					}
				} catch (e) {
					console.error('[VIOLA-YT] playVideo() error:', e);
				}
			},
			pause: function () {
				console.log('[Viola YouTube Player] pause() called');
				window.violaYoutube._wantsToPlay = false;
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.pauseVideo === 'function') {
						window.violaYoutube._player.pauseVideo();
					}
				} catch (e) { /* no-op */ }
			},
			stop: function () {
				console.log('[Viola YouTube Player] stop() called');
				window.violaYoutube._wantsToPlay = false;
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.stopVideo === 'function') {
						window.violaYoutube._player.stopVideo();
					}
				} catch (e) { /* no-op */ }
			},
			seekTo: function (seconds) {
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.seekTo === 'function') {
						window.violaYoutube._player.seekTo(Number(seconds) || 0, true);
					}
				} catch (e) { /* no-op */ }
			},
			setVolume: function (level) {
				try {
					// Spoke mode: YouTube audio must stay muted (audio via PCM)
					if (muteParam) return;
					// YouTube volume is 0-100
					var vol = Math.max(0, Math.min(100, Number(level) || 0));
					if (window.violaYoutube._player && typeof window.violaYoutube._player.setVolume === 'function') {
						window.violaYoutube._player.setVolume(vol);
						console.log('[Viola YouTube Player] Volume set to:', vol);
					}
				} catch (e) {
					console.warn('[Viola YouTube Player] setVolume error:', e);
				}
			},
			getVolume: function () {
				try {
					if (window.violaYoutube._player && typeof window.violaYoutube._player.getVolume === 'function') {
						return window.violaYoutube._player.getVolume();
					}
				} catch (e) { /* no-op */ }
				return 100;
			},
			mute: function () {
				try {
					// Spoke mode: never call player.mute() - it kills the WASAPI stream.
					// Use setVolume(0) instead (keeps WASAPI alive for ProcTap capture).
					if (muteParam) {
						if (window.violaYoutube._player && typeof window.violaYoutube._player.setVolume === "function") {
							window.violaYoutube._player.setVolume(0);
						}
						return;
					}
					if (window.violaYoutube._player && typeof window.violaYoutube._player.mute === "function") {
						window.violaYoutube._player.mute();
					}
				} catch (e) { /* no-op */ }
			},
			unMute: function () {
				try {
					// Spoke mode: never unmute (audio via PCM)
					if (muteParam) return;
					if (window.violaYoutube._player && typeof window.violaYoutube._player.unMute === 'function') {
						window.violaYoutube._player.unMute();
					}
				} catch (e) { /* no-op */ }
			}
		};

		// Helper function to retry playVideo() with exponential backoff
		function retryPlayVideo(reason) {
			if (!window.violaYoutube._wantsToPlay) {
				console.log('[Viola YouTube Player] retryPlayVideo skipped - _wantsToPlay is false');
				return;
			}
			if (window.violaYoutube._playRetryCount >= window.violaYoutube._maxPlayRetries) {
				console.error('[Viola YouTube Player] Max play retries reached (' + window.violaYoutube._maxPlayRetries + ')');
				postState('yt_iframe_autoplay_blocked', { reason: 'max_retries', retries: window.violaYoutube._playRetryCount });
				return;
			}
			window.violaYoutube._playRetryCount++;
			var stateBeforeRetry = window.violaYoutube._player ? window.violaYoutube._player.getPlayerState() : 'no_player';
			var durationBeforeRetry = window.violaYoutube._player && window.violaYoutube._player.getDuration ? window.violaYoutube._player.getDuration() : 0;
			debugLog('retryPlayVideo', {attempt: window.violaYoutube._playRetryCount, reason: reason, stateBefore: stateBeforeRetry, duration: durationBeforeRetry});
			console.warn('[Viola YouTube Player] Retry playVideo() attempt ' + window.violaYoutube._playRetryCount + ' - reason: ' + reason);

			try {
				if (window.violaYoutube._player && typeof window.violaYoutube._player.playVideo === 'function') {
					// After 3 failed attempts, try mute-then-unmute approach
					// This bypasses stricter autoplay policies on some videos
					if (window.violaYoutube._playRetryCount >= 3 && !window.violaYoutube._triedMutedStart) {
						console.warn('[Viola YouTube Player] Trying muted start workaround');
						window.violaYoutube._triedMutedStart = true;
						if (!muteParam) {
							// Hub mode: use mute() for autoplay policy bypass
							window.violaYoutube._player.mute();
						}
						// Spoke mode: volume already 0 from onReady, skip mute() (kills WASAPI)
						window.violaYoutube._player.playVideo();
						// Unmute after a short delay once playing — but NOT in spoke mode
						// (spoke audio comes from PCM, YouTube audio must stay muted)
						setTimeout(function() {
							if (window.violaYoutube._player && window.violaYoutube._player.getPlayerState() === 1 && !muteParam) {
								console.log('[Viola YouTube Player] Muted start worked, unmuting...');
								window.violaYoutube._player.unMute();
							}
						}, 500);
					} else {
						window.violaYoutube._player.playVideo();
					}
				}
			} catch (e) {
				console.error('[Viola YouTube Player] retryPlayVideo error:', e);
			}
		}

		function getDebugAuthToken() {
			try {
				return window.__VIOLA_DEBUG_AUTH_TOKEN__ ||
					(window.parent && window.parent.__VIOLA_DEBUG_AUTH_TOKEN__) ||
					'';
			} catch (e) {
				return '';
			}
		}

		function postDebugEvent(payload) {
			try {
				const token = getDebugAuthToken();
				if (!token) {
					return;
				}
				fetch('/v1/debug/yt-iframe-event', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'X-Debug-Auth-Token': token },
					body: JSON.stringify(payload)
				}).catch(function() {});
			} catch (e) { /* no-op */ }
		}

		// DIAGNOSTIC: Send events to backend for server-side logging
		function sendDiagnostic(event, data) {
			postDebugEvent({ event: event, ...data, timestamp: Date.now() });
		}

		// DEBUG: Send debug logs to backend for capture
		function debugLog(message, data) {
			console.log('[YT DEBUG]', message, data || '');
			postDebugEvent({ event: 'DEBUG_LOG', message: message, data: data, timestamp: Date.now() });
		}

		// Notify native side AND React parent when state changes
		function postState(eventName, payload) {
			try {
				// Use QWebChannel bridge if available (Qt native)
				if (qt_bridge) {
					if (eventName === 'yt_iframe_state' && payload) {
						// Map numeric state to string for Python bridge
						var stateMap = {
							'-1': 'UNSTARTED',
							'0': 'ENDED',
							'1': 'PLAYING',
							'2': 'PAUSED',
							'3': 'BUFFERING',
							'5': 'CUED'
						};
						var stateStr = stateMap[String(payload.state)] || 'UNKNOWN';
						var currentTime = payload.currentTime || 0;
						qt_bridge.on_state(stateStr, currentTime);
						console.log('[Viola YouTube Player] State sent via QWebChannel:', stateStr, currentTime);
					} else if (eventName === 'yt_iframe_error' && payload) {
						qt_bridge.on_error(payload.error || 0);
					}
				}
				// Fallback: legacy qtBridge or chrome webview
				else if (window.qtBridge && typeof window.qtBridge.postMessage === 'function') {
					window.qtBridge.postMessage(JSON.stringify({ type: eventName, payload: payload || {} }));
				} else if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
					window.chrome.webview.postMessage({ type: eventName, payload: payload || {} });
				}

				// ALWAYS send to parent window for React UI (runs in iframe context)
				try {
					window.parent.postMessage({ type: eventName, payload: payload || {} }, '*');
				} catch (e) { /* ignore if no parent */ }
			} catch (e) {
				console.warn('[Viola YouTube Player] postState error:', e);
			}
		}

		// DOM element references (will be set when DOM is ready)
		var loadingEl = null;
		var errorEl = null;

		// Initialize DOM references when ready
		function initDOMRefs() {
			loadingEl = document.getElementById('loading-message');
			errorEl = document.getElementById('error-message');
		}

		// Run on DOM ready
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', initDOMRefs);
		} else {
			initDOMRefs();
		}

		// Listen for control commands from React parent
		window.addEventListener('message', function(event) {
			var data = event.data || {};

			// Handle diagnostic requests
			if (data.type === 'diagnostic_request') {
				console.log('[Viola YouTube Player] Diagnostic request received');
				window.violaDiagnostics.sendToParent();
				return;
			}

			if (data.type !== 'control') return;

			var command = data.command;
			console.log('[Viola YouTube Player] Received control command:', command, data);

			try {
				if (command === 'setVolume' && data.level !== undefined) {
					window.violaYoutube.setVolume(data.level);
					sendDiagnostic('CONTROL_VOLUME', { level: data.level });
				} else if (command === 'seekTo' && data.seconds !== undefined) {
					window.violaYoutube.seekTo(data.seconds);
					sendDiagnostic('CONTROL_SEEK', { seconds: data.seconds });
				} else if (command === 'play') {
					window.violaYoutube.play();
					sendDiagnostic('CONTROL_PLAY', {});
				} else if (command === 'pause') {
					window.violaYoutube.pause();
					sendDiagnostic('CONTROL_PAUSE', {});
				} else if (command === 'stop') {
					window.violaYoutube.stop();
					sendDiagnostic('CONTROL_STOP', {});
				} else if (command === 'pause_for_ms' && data.duration_ms !== undefined) {
					// Micro-pause correction for multi-room sync (spoke is ahead)
					window.violaYoutube.pause();
					setTimeout(function() {
						window.violaYoutube.play();
					}, data.duration_ms);
					sendDiagnostic('CONTROL_PAUSE_FOR_MS', { duration_ms: data.duration_ms });
				} else if (command === 'setPlaybackRate' && data.rate !== undefined) {
					// YouTube only supports: 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2
					var validRates = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
					if (validRates.indexOf(data.rate) === -1) {
						console.warn('[Viola YouTube Player] Non-standard playback rate ignored:', data.rate,
							'(YouTube only supports:', validRates.join(', '), ')');
						sendDiagnostic('CONTROL_PLAYBACK_RATE_REJECTED', { rate: data.rate });
					} else {
						var yt = window.violaYoutube && window.violaYoutube._player;
						if (yt && typeof yt.setPlaybackRate === 'function') {
							yt.setPlaybackRate(data.rate);
						}

		// Shows diagnostic info inside the iframe itself (visible on phone)
		// =========================================================================
		(function() {
			var debugMode = getQueryParam('debug') === '1';
			if (!debugMode) return;

			var overlay = document.getElementById('debug-overlay');
			if (!overlay) return;
			overlay.style.display = 'block';

			var state = {
				pageLoaded: true,
				origin: window.location.origin,
				videoParam: getQueryParam('video') || '(none)',
				ytApiLoaded: false,
				playerCreated: false,
				playerState: 'not yet',
				errorCode: '(none)',
				iframeSrc: '(not yet)',
				referrer: document.referrer || '(empty)',
				protocol: window.location.protocol,
				host: window.location.host,
			};

			function cls(ok) { return ok ? 'dbg-ok' : 'dbg-err'; }

			function render() {
				overlay.innerHTML =
					'<div class="dbg-title">YouTube Player Diagnostics</div>' +
					'<div>Page loaded: <b class="' + cls(state.pageLoaded) + '">' + (state.pageLoaded ? 'YES' : 'NO') + '</b></div>' +
					'<div>Origin: <b>' + state.origin + '</b></div>' +
					'<div>Protocol: <b>' + state.protocol + '</b></div>' +
					'<div>Host: <b>' + state.host + '</b></div>' +
					'<div>Referrer: <b>' + state.referrer + '</b></div>' +
					'<div>Video ID: <b class="' + cls(state.videoParam !== '(none)') + '">' + state.videoParam + '</b></div>' +
					'<div>YouTube API loaded: <b class="' + cls(state.ytApiLoaded) + '">' + (state.ytApiLoaded ? 'YES' : 'NO') + '</b></div>' +
					'<div>Player created: <b class="' + cls(state.playerCreated) + '">' + (state.playerCreated ? 'YES' : 'NO') + '</b></div>' +
					'<div>Player state: <b class="' + (state.playerState === 'PLAYING' ? 'dbg-ok' : state.playerState === 'ERROR' ? 'dbg-err' : 'dbg-warn') + '">' + state.playerState + '</b></div>' +
					'<div>Error code: <b class="' + (state.errorCode === '(none)' ? 'dbg-ok' : 'dbg-err') + '">' + state.errorCode + '</b></div>' +
					'<div style="word-break:break-all">Player frame source: <b>' + state.iframeSrc + '</b></div>';
			}

			render();

			// Poll for state changes every 500ms
			setInterval(function() {
				state.ytApiLoaded = !!(window.YT && window.YT.Player);
				state.playerCreated = !!(window.violaYoutube && window.violaYoutube._player);

				if (state.playerCreated && window.violaYoutube._player) {
					try {
						var ps = window.violaYoutube._player.getPlayerState();
						var names = { '-1': 'UNSTARTED', '0': 'ENDED', '1': 'PLAYING', '2': 'PAUSED', '3': 'BUFFERING', '5': 'CUED' };
						state.playerState = names[String(ps)] || 'UNKNOWN(' + ps + ')';
					} catch(e) { state.playerState = 'ERROR: ' + e.message; }
				}

				if (window.violaYoutube && window.violaYoutube._lastError) {
					var ec = window.violaYoutube._lastError;
					var errorNames = { 2: 'INVALID_PARAM', 5: 'HTML5_ERROR', 100: 'NOT_FOUND', 101: 'EMBED_RESTRICTED', 150: 'EMBED_RESTRICTED' };
					state.errorCode = ec + ' (' + (errorNames[ec] || 'unknown') + ')';
				}

				// Find YouTube's inner iframe
				var playerEl = document.getElementById('player');
				if (playerEl) {
					var inner = playerEl.tagName === 'IFRAME' ? playerEl : playerEl.querySelector('iframe');
					if (inner && inner.src) {
						state.iframeSrc = inner.src;
					}
				}

				render();
			}, 500);
		})();
	</script>
</body>
