<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect to Viola</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: #111; border-radius: 16px;
      padding: 40px 32px; text-align: center;
      border: 1px solid #222;
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 16px;
      background: #6366f1; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #fff;
    }
    h1 {
      font-size: 22px; font-weight: 600; margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 14px; color: #888; margin-bottom: 28px;
      line-height: 1.5;
    }
    .input-wrap {
      position: relative; margin-bottom: 16px;
    }
    input[type="text"] {
      width: 100%; padding: 14px 16px;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 10px; color: #fff;
      font-size: 18px; text-align: center;
      outline: none; transition: border-color 0.2s;
      letter-spacing: 1px;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
    }
    input[type="text"]::placeholder {
      color: #555; letter-spacing: 0;
      font-size: 15px;
    }
    .btn {
      width: 100%; padding: 14px;
      background: #6366f1; border: none; border-radius: 10px;
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      margin-bottom: 12px;
    }
    .btn:hover { background: #5254cc; }
    .btn:active { background: #4345b0; }
    .btn:disabled {
      background: #333; color: #666; cursor: not-allowed;
    }
    .toggle {
      font-size: 13px; color: #6366f1; background: none;
      border: none; cursor: pointer; padding: 4px 0;
      text-decoration: underline; margin-bottom: 4px;
    }
    .toggle:hover { color: #818cf8; }
    .error {
      color: #f87171; font-size: 13px; margin-top: 8px;
      min-height: 18px;
    }
    .footer {
      margin-top: 32px; font-size: 12px; color: #555;
    }
    .footer a {
      color: #6366f1; text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .hint {
      font-size: 12px; color: #555; margin-bottom: 20px;
      line-height: 1.5;
    }
    @media (max-width: 440px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">V</div>
    <h1>Connect to Viola</h1>
    <p class="subtitle" id="subtitle">Enter the pairing word shown on your Viola hub.</p>
    <div class="hint" id="hint">Look for it in Settings &gt; Network on the hub screen.</div>
    <form id="form" autocomplete="off">
      <div class="input-wrap">
        <input type="text" id="input" placeholder="e.g. maple" autofocus spellcheck="false" autocapitalize="none" autocorrect="off" />
      </div>
      <button type="submit" class="btn" id="connectBtn">Connect</button>
    </form>
    <button class="toggle" id="toggleMode">Have a code instead?</button>
    <div class="error" id="error"></div>
  </div>
  <div class="footer">
    <a href="https://github.com/nicholasgasior/viola" target="_blank" rel="noopener">Don't have Viola?</a>
  </div>
  <script>
    var WORDS = [
      "acre","agate","aglow","airy","alder","alert","align","alive","alloy","aloft",
      "amber","ample","angel","anvil","apex","apple","apron","arbor","arena","arrow",

      "batch","beach","beam","bean","begin","bench","berry","birch","blade","blaze",
      "bliss","bloom","bluff","board","bonus","booth","bound","bower","brave","bravo",
      "bread","brick","brief","brine","brook","brush","bunch","cabin","calm","canal",
      "candy","canoe","cape","cargo","cedar","chalk","charm","chess","chime","chord",
      "cider","civic","claim","clash","clasp","clean","clear","cliff","climb","cloak",
      "close","cloud","clove","coach","coast","comet","coral","corgi","couch","count",
      "cover","cozy","crane","crate","creek","crest","crisp","cross","crown","crush",
      "curve","cycle","daisy","dance","dawn","delta","depth","derby","desk","digit",
      "diner","dizzy","dock","dodge","dome","donor","dove","draft","dream","drift",
      "drive","drum","dune","dusk","eagle","earth","easel","ebony","edge","eight",
      "elbow","elder","elite","elm","ember","entry","equal","event","every","exact",
      "extra","fable","fairy","faith","fawn","feast","fence","fern","fiber","field",
      "finch","fire","flame","flare","flask","fleet","flora","flute","focal","folly",
      "forge","forum","frame","fresh","front","frost","fruit","fully","gable","gains",
      "gale","gauge","gavel","gear","giant","giver","glad","glade","glass","gleam",
      "glide","globe","gloss","glow","gourd","grace","grain","grand","graph","grasp",
      "grass","graze","green","grove","guild","habit","halo","happy","hardy","haven",
      "hazel","heart","hedge","hello","herb","heron","hiker","hinge","hobby","holly",
      "honey","honor","horse","house","hover","human","humor","ideal","igloo","image",
      "index","indie","inlet","inner","input","intro","ivory","jewel","jolly","juice",
      "jumbo","kayak","knack","knoll","kudos","label","laced","lake","lance","lapis",
      "larch","latch","layer","ledge","lemon","level","light","lilac","linen","links",
      "lofty","logic","lotus","lunar","lush","lyric","magic","major","mango","manor",
      "maple","march","marsh","match","mayor","melon","merge","merit","micro","might",
      "mint","minus","mirth","mixer","mocha","model","money","month","moral","motor",
      "mount","mural","muse","navel","nerve","noble","north","notch","novel","oasis",
      "ocean","olive","omega","onset","opal","opera","orbit","otter","outer","owner",
      "paint","palm","panel","paper","park","party","paste","patch","patio","pause",
      "peach","pearl","penny","perch","petal","phase","photo","pilot","pixel","plain",
      "plane","plant","plume","plush","point","polar","porch","power","press","prime",
      "print","prism","prize","probe","proud","prune","pulse","quail","queen","quest",
      "quiet","quilt","quota","quote","radar","rainy","ramp","range","rapid","raven",
      "reach","realm","reign","relax","rider","ridge","river","robin","rocky","route",
      "royal","ruler","rusty","saint","salad","salon","salsa","sandy","satin","scale",
      "scene","scope","scout","sedan","sense","shade","share","shark","shelf","shell",
      "shift","shine","shore","shown","sight","silk","siren","skate","slate","slice",
      "slide","slope","smile","smoke","snowy","solar","solid","sonic","south","space",
      "spark","spell","spice","spoke","spray","stack","staff","stage","stair","stamp",
      "stand","stare","start","steam","steel","steep","stern","still","stock","stone",
      "stool","store","storm","stove","strip","study","style","sugar","suite","sunny",
      "surge","swamp","sweep","swift","syrup","table","talon","tango","tangy","tempo",
      "tiger","tiled","timer","toast","token","topaz","torch","total","tower","trace",
      "track","trail","trait","trend","tribe","trick","tried","trill","trout","truly",
      "tulip","tuner","tweed","twist","ultra","uncle","unify","unite","unity","until",
      "upper","urban","using","valid","valor","valve","vapor","vault","vegan","verse",
      "vigor","vinyl","viola","vivid","vocal","voice","voter","wafer","wagon","waltz",
      "watch","water","weave","wedge","wheat","wheel","whole","width","windy","wired",
      "witch","worth","woven","wrist","xenon","yacht","yield","young","zebra","zesty",
      "zippy","zone"
    ];

    var mode = "word";
    var inputEl = document.getElementById("input");
    var errorEl = document.getElementById("error");
    var subtitleEl = document.getElementById("subtitle");
    var hintEl = document.getElementById("hint");
    var toggleBtn = document.getElementById("toggleMode");
    var form = document.getElementById("form");

    function decode(val) {
      var clean = (val || "").trim().toLowerCase();
      if (!clean) return null;

      var idx = WORDS.indexOf(clean);
      if (idx >= 0) {
        var o2 = Math.floor(idx / 256);
        var o3 = idx % 256;
        return "192.168." + o2 + "." + o3;
      }

      try {
        var num = parseInt(clean, 36);
        if (isNaN(num) || num < 0 || num > 0xFFFFFFFF) return null;
        var a = (num >>> 24) & 0xFF;
        var b = (num >>> 16) & 0xFF;
        var c = (num >>> 8) & 0xFF;
        var d = num & 0xFF;
        return a + "." + b + "." + c + "." + d;
      } catch (e) {
        return null;
      }
    }

    toggleBtn.addEventListener("click", function () {
      if (mode === "word") {
        mode = "code";
        subtitleEl.textContent = "Enter the pairing code shown on your Viola hub.";
        hintEl.textContent = "A 6-character code like 1A2B3C.";
        inputEl.placeholder = "e.g. 1A2B3C";
        toggleBtn.textContent = "Have a word instead?";
      } else {
        mode = "word";
        subtitleEl.textContent = "Enter the pairing word shown on your Viola hub.";
        hintEl.textContent = "Look for it in Settings > Network on the hub screen.";
        inputEl.placeholder = "e.g. maple";
        toggleBtn.textContent = "Have a code instead?";
      }
      inputEl.value = "";
      errorEl.textContent = "";
      inputEl.focus();
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorEl.textContent = "";
      var val = inputEl.value.trim();
      if (!val) {
        errorEl.textContent = mode === "word" ? "Please enter a pairing word." : "Please enter a pairing code.";
        return;
      }
      var ip = decode(val);
      if (!ip) {
        errorEl.textContent = "That doesn't look right. Check the " + mode + " and try again.";
        inputEl.select();
        return;
      }
      window.location.href = "http://" + ip + ":8756/?room=default";
    });

    inputEl.focus();
  </script>
</body>
</html>
